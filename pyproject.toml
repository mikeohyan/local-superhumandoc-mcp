[project]
name = "superhumandoc-mcp"
version = "0.3.1"
description = "MCP server for a single Superhuman Docs document."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3",
    "httpx2>=2.5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
superhumandoc-mcp = "superhumandoc_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superhumandoc_mcp"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "superhumandoc_mcp/templates/env.example"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
